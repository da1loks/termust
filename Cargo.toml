[package]
name = "termust"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Native terminal workspace for local shells, SSH and SFTP"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
zeroize = "1"

[profile.release]
lto = "thin"
strip = "symbols"
